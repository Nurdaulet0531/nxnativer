name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Hugging Face Dataset Repo (e.g. username/switch-games)'
        required: true
        type: string
      base_file:
        description: 'Base game filename in HF repo (e.g. base.nsp)'
        required: true
        type: string
        default: 'base.nsp'
      update_file:
        description: 'Update filename in HF repo (Optional: leave blank for base-only)'
        required: false
        type: string
        default: ''
      commit_sha:
        description: 'nxnative branch or commit SHA (leave as main for latest)'
        required: false
        type: string
        default: 'main'

jobs:
  build-ipa:
    runs-on: macos-26

    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4
        with:
          repository: 'seedds/nxnative'
          ref: ${{ github.event.inputs.commit_sha || 'main' }}

      - name: Patch upstream for GitHub Runner SDK & VM GLSLC Capture
        run: |
          python3 -c '
          import pathlib, re

          # 1. Fix DmGamepad.m iOS 27 SDK property on Xcode 26
          p = pathlib.Path("dm/ios/Sources/DmGamepad.m")
          if p.exists():
              p.write_text(p.read_text().replace("g_motion.deviceMotionBody = body;", "(void)body;"))

          # 2. Patch nvn_mtl.m for VM Classic Metal fallback + Xcode 26 MetalFX SDK compatibility
          mtl = pathlib.Path("dm/gfx/nvn/nvn_mtl.m")
          if mtl.exists():
              txt = mtl.read_text()

              # Allow classic Metal fallback on VM runners without Metal 4
              txt = txt.replace(
                  "static int g_classic_ok, g_classic;",
                  "static int g_classic_ok = 1, g_classic;"
              )
              txt = txt.replace(
                  "if (!g_classic_ok) MDIE(",
                  "if (0 && !g_classic_ok) MDIE("
              )

              # Comment out Xcode 27-only MTL4FXTemporalScaler offset properties
              txt = re.sub(
                  r"^.*sc\.(colorContentOffset|depthContentOffset|motionContentOffset|outputOffset)[XY]\s*=.*$",
                  "            // stripped Xcode 27 MTL4FXTemporalScaler offset properties for Xcode 26",
                  txt,
                  flags=re.MULTILINE
              )

              mtl.write_text(txt)
          '
          git diff

      - name: Select latest Xcode 26
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

          python3 -m venv ~/build_env
          source ~/build_env/bin/activate

          pip install --upgrade pip
          pip install lz4 "capstone>=5,<6" fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          printf '%s\n' "$PROD_KEYS_CONTENT" > ~/.switch/prod.keys

      - name: Restore Compiled Shaders Cache
        uses: actions/cache/restore@v4
        id: shader-cache
        with:
          path: ~/Games/InputGame/*_build/shader
          key: nxnative-shaders-${{ github.event.inputs.hf_repo }}-${{ github.event.inputs.base_file }}-${{ github.event.inputs.update_file }}
          restore-keys: |
            nxnative-shaders-${{ github.event.inputs.hf_repo }}-${{ github.event.inputs.base_file }}-

      - name: Download Game NSPs from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO: ${{ github.event.inputs.hf_repo }}
          BASE: ${{ github.event.inputs.base_file }}
          UPDATE: ${{ github.event.inputs.update_file }}
        run: |
          mkdir -p ~/Games/InputGame

          echo "Downloading Base Game ($BASE) from $REPO..."
          curl -f -L -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/datasets/$REPO/resolve/main/$BASE" \
            -o ~/Games/InputGame/base.nsp

          if [ -n "$UPDATE" ]; then
            echo "Downloading Update ($UPDATE) from $REPO..."
            curl -f -L -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/$REPO/resolve/main/$UPDATE" \
              -o ~/Games/InputGame/update.nsp
          else
            echo "No update file specified. Proceeding with base game only."
          fi

          ls -lh ~/Games/InputGame/
          df -h /

      - name: Build IPA
        run: |
          source ~/build_env/bin/activate

          export DM_ALLOW_OTHER_METAL=1
          export ALLOW_OTHER_METAL=1

          python scripts/build_ipa_from_nsp.py ~/Games/InputGame -k ~/.switch/prod.keys --allow-other-metal

      - name: Save Compiled Shaders Cache
        uses: actions/cache/save@v4
        if: always() && steps.shader-cache.outputs.cache-hit != 'true'
        with:
          path: ~/Games/InputGame/*_build/shader
          key: nxnative-shaders-${{ github.event.inputs.hf_repo }}-${{ github.event.inputs.base_file }}-${{ github.event.inputs.update_file }}

      - name: Verify Compiled Executable & Free Temp Space
        run: |
          # Delete raw NSPs and extracted RomFS immediately so the runner never runs out of disk space
          rm -f ~/Games/InputGame/*.nsp
          rm -rf ~/Games/InputGame/*_build/extract
          rm -rf ~/Games/InputGame/*_build/ipa

          IPA_PATH=$(find ~/Games/InputGame -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No IPA found!"
            exit 1
          fi

          echo "Inspecting IPA executable without unpacking 15GB of assets..."
          mkdir -p /tmp/ipa_inspect
          # Only extract the DmIOS binary and Info.plist, NOT the huge RomFS folder
          unzip -q "$IPA_PATH" "Payload/*.app/DmIOS" "Payload/*.app/Info.plist" -d /tmp/ipa_inspect

          APP_DIR=$(ls -d /tmp/ipa_inspect/Payload/*.app | head -n 1)
          if [ -f "$APP_DIR/DmIOS" ]; then
            file "$APP_DIR/DmIOS"
            ls -lh "$APP_DIR/DmIOS"
            echo "SUCCESS: DmIOS Mach-O executable is present and valid."
          else
            echo "FAILURE: DmIOS executable is missing!"
            exit 1
          fi
          rm -rf /tmp/ipa_inspect
          df -h /

      - name: Package & Split Output IPA
        run: |
          mkdir -p output
          find ~/Games/InputGame -name "*.ipa" -exec mv {} output/ \;
          cd output
          # Use -0 (store mode) so it splits in seconds instead of re-compressing for 8 minutes
          zip -0 -s 1500m game_ipa.zip *.ipa
          # Delete the unsplit .ipa so we don't run out of space or upload duplicates
          rm -f *.ipa
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa
          path: output/game_ipa*
          retention-days: 1
