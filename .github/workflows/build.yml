name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Hugging Face Dataset Repo (e.g. your-username/switch-games)'
        required: true
        type: string
      base_file:
        description: 'Base game filename in HF repo (default: base.nsp)'
        required: true
        type: string
        default: 'base.nsp'
      update_file:
        description: 'Update filename in HF repo (Optional: leave blank for base-only)'
        required: false
        type: string
        default: ''

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4
        with:
          repository: 'seedds/nxnative'
          ref: 'main'

      - name: Select latest Xcode 16+
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Patch repository sources & build scripts
        run: |
          # 1. Target M1 instead of unknown apple-a18
          grep -rl "apple-a18" . | xargs sed -i '' 's/apple-a18/apple-m1/g' || true

          # 2. Fix unresolvable UI style in Launcher.swift
          sed -i '' 's/\.glassProminent/\.borderedProminent/g' dm/ios/Sources/Launcher.swift || true
          sed -i '' 's/glassProminent/borderedProminent/g' dm/ios/Sources/Launcher.swift || true

          # 3. Strip incompatible Metal compiler flags
          grep -rl -- "-fmetal-math-mode=relaxed" . | xargs sed -i '' 's/-fmetal-math-mode=relaxed//g' || true

          # 4. Standardize project objectVersion
          grep -rl "objectVersion = 7" . | xargs sed -i '' 's/objectVersion = 7[0-9]/objectVersion = 56/g' || true

          # 5. Make nvn_deswizzle_gpu.h backward compatible by aliasing MTL4 types to standard Metal types
          cat << 'EOF' > /tmp/compat_header.h
          #import <Metal/Metal.h>
          @protocol MTL4ComputeCommandEncoder <MTLComputeCommandEncoder>
          @end
          @protocol MTL4ArgumentTable <NSObject>
          @end
          @protocol MTL4CommandQueue <MTLCommandQueue>
          @end
          @protocol MTL4CommandBuffer <MTLCommandBuffer>
          @end
          @protocol MTL4CommandAllocator <NSObject>
          @end
          typedef struct { uint32_t dummy; } MTL4CommitOptions;
          EOF
          
          for h in dm/gfx/tex/nvn_deswizzle_gpu.h dm/gfx/nvn/nvn_rec.h; do
            if [ -f "$h" ]; then
              cat /tmp/compat_header.h "$h" > "${h}.tmp" && mv "${h}.tmp" "$h"
            fi
          done

          # 6. Hook build_ipa.sh so right before xcodebuild runs, it stubs out the broken methods in the generated .m file
          python3 -c '
          import os

          for root, dirs, files in os.walk("."):
              for f in files:
                  if f == "build_ipa.sh" or f.endswith(".sh"):
                      p = os.path.join(root, f)
                      with open(p, "r", errors="ignore") as file:
                          content = file.read()
                      if "xcodebuild" in content:
                          injection = """
          find . -type f -name "gfx__tex__nvn_deswizzle_gpu.m" -exec sh -c "echo \"#import <Metal/Metal.h>\" > {}" \;
          """
                          content = content.replace("xcodebuild", injection + "\nxcodebuild")
                          with open(p, "w") as file:
                              file.write(content)
          '

      - name: Set up dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

          python3 -m venv ~/build_env
          source ~/build_env/bin/activate

          pip install --upgrade pip
          pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS_CONTENT" > ~/.switch/prod.keys

      - name: Download Game NSPs from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p ~/Games/InputGame
          REPO="${{ github.event.inputs.hf_repo }}"
          BASE="${{ github.event.inputs.base_file }}"
          UPDATE="${{ github.event.inputs.update_file }}"

          echo "Downloading Base Game ($BASE) from $REPO..."
          curl -f -L -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/datasets/$REPO/resolve/main/$BASE" \
            -o ~/Games/InputGame/base.nsp

          if [ -n "$UPDATE" ]; then
            echo "Downloading Update ($UPDATE) from $REPO..."
            curl -f -L -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/datasets/$REPO/resolve/main/$UPDATE" \
              -o ~/Games/InputGame/update.nsp
          else
            echo "No update file specified. Proceeding with base game only."
          fi

          echo "Checking downloaded files:"
          ls -lh ~/Games/InputGame/

      - name: Build IPA
        run: |
          source ~/build_env/bin/activate

          export DM_ALLOW_OTHER_METAL=1
          export ALLOW_OTHER_METAL=1

          python scripts/build_ipa_from_nsp.py ~/Games/InputGame -k ~/.switch/prod.keys --allow-other-metal

      - name: Dump Xcode logs on failure
        if: failure()
        run: |
          echo "=== Dumping build_ipa.log ==="
          find ~/Games/InputGame -name "build_ipa.log" -exec tail -n 100 {} + || true
          echo "=== Dumping pkg/build.log ==="
          find ~/Games/InputGame -name "build.log" -exec tail -n 100 {} + || true

      - name: Package & Split Output IPA
        run: |
          mkdir -p output
          find ~/Games/InputGame -name "*.ipa" -exec mv {} output/ \;
          cd output
          zip -s 1500m -r game_ipa.zip *.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa
          path: output/game_ipa*
          retention-days: 1
