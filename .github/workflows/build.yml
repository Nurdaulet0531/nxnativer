name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      base_game_drive_id:
        description: 'Google Drive File ID for Base Game (.nsp)'
        required: true
        type: string
      update_drive_id:
        description: 'Google Drive File ID for Update (.nsp) [Optional: Leave blank for base-only]'
        required: false
        type: string
        default: ''

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4
        with:
          repository: 'seedds/nxnative'
          ref: 'main'

      - name: Select latest Xcode 16+
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Patch repository sources & build scripts
        run: |
          # 1. Target M1/A16 instead of unknown apple-a18
          grep -rl "apple-a18" . | xargs sed -i '' 's/apple-a18/apple-m1/g' || true

          # 2. Fix unresolvable UI style in Launcher.swift
          sed -i '' 's/\.glassProminent/\.borderedProminent/g' dm/ios/Sources/Launcher.swift || true
          sed -i '' 's/glassProminent/borderedProminent/g' dm/ios/Sources/Launcher.swift || true

          # 3. Strip incompatible Metal compiler flags
          grep -rl -- "-fmetal-math-mode=relaxed" . | xargs sed -i '' 's/-fmetal-math-mode=relaxed//g' || true

          # 4. Standardize project objectVersion
          grep -rl "objectVersion = 7" . | xargs sed -i '' 's/objectVersion = 7[0-9]/objectVersion = 56/g' || true

          # 5. Patch generators and static headers across the repo
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f.endswith((".py", ".m", ".h", ".sh")):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", errors="ignore") as file:
                              c = file.read()
                          modified = False
                          if "MTL4ComputeCommandEncoder" in c:
                              c = c.replace("MTL4ComputeCommandEncoder", "MTLComputeCommandEncoder")
                              modified = True
                          if "MTL4ArgumentTable" in c:
                              c = c.replace("MTL4ArgumentTable", "id<MTLBuffer>")
                              modified = True
                          if modified:
                              with open(p, "w") as file:
                                  file.write(c)
                      except Exception:
                          pass
          '

          # 6. Intercept xcodebuild with a wrapper script to wipe out setArgumentTable from Gen/ before compiling
          sudo mv /usr/bin/xcodebuild /usr/bin/xcodebuild.orig 2>/dev/null || true
          sudo mv "$(which xcodebuild)" "$(which xcodebuild).real" 2>/dev/null || true
          REAL_XCODEBUILD="$(which xcodebuild.real || echo '/Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild')"

          cat << 'EOF' > /tmp/xcodebuild_wrapper
          #!/bin/bash
          # Sanitize any dynamically generated Gen/ source files right before compiling
          python3 -c '
          import os, re
          gen_dir = "dm/ios/Gen/src"
          if os.path.exists(gen_dir):
              for f in os.listdir(gen_dir):
                  if f.endswith(".m"):
                      path = os.path.join(gen_dir, f)
                      with open(path, "r", errors="ignore") as file:
                          c = file.read()
                      c = c.replace("MTL4ComputeCommandEncoder", "MTLComputeCommandEncoder")
                      c = c.replace("MTL4ArgumentTable", "id<MTLBuffer>")
                      # Strip out any lines invoking setArgumentTable or setAddress
                      lines = []
                      for line in c.splitlines():
                          if "setArgumentTable" in line or "setAddress:" in line:
                              continue
                          lines.append(line)
                      with open(path, "w") as file:
                          file.write("\n".join(lines))
          ' 2>/dev/null || true

          exec xcodebuild.real "$@"
          EOF

          chmod +x /tmp/xcodebuild_wrapper
          REAL_BIN_DIR=$(dirname "$REAL_XCODEBUILD")
          sudo mv /tmp/xcodebuild_wrapper "$REAL_BIN_DIR/xcodebuild"

      - name: Set up dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

          python3 -m venv ~/build_env
          source ~/build_env/bin/activate

          pip install --upgrade pip
          pip install gdown lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS_CONTENT" > ~/.switch/prod.keys

      - name: Download Game NSPs from Google Drive
        run: |
          source ~/build_env/bin/activate
          mkdir -p ~/Games/InputGame

          echo "Downloading Base Game..."
          for i in {1..10}; do
            gdown "${{ github.event.inputs.base_game_drive_id }}" -O ~/Games/InputGame/base.nsp --continue && break || sleep 5
          done

          UPDATE_ID="${{ github.event.inputs.update_drive_id }}"
          if [ -n "$UPDATE_ID" ]; then
            echo "Downloading Update..."
            for i in {1..10}; do
              gdown "$UPDATE_ID" -O ~/Games/InputGame/update.nsp --continue && break || sleep 5
            done
          else
            echo "No update ID provided. Proceeding with base game only."
          fi

      - name: Build IPA
        run: |
          source ~/build_env/bin/activate

          export DM_ALLOW_OTHER_METAL=1
          export ALLOW_OTHER_METAL=1
          export DM_NO_METAL4=1

          python scripts/build_ipa_from_nsp.py ~/Games/InputGame -k ~/.switch/prod.keys --allow-other-metal

      - name: Dump Xcode logs on failure
        if: failure()
        run: |
          echo "=== Dumping build_ipa.log ==="
          find ~/Games/InputGame -name "build_ipa.log" -exec tail -n 100 {} + || true
          echo "=== Dumping pkg/build.log ==="
          find ~/Games/InputGame -name "build.log" -exec tail -n 100 {} + || true

      - name: Package & Split Output IPA
        run: |
          mkdir -p output
          find ~/Games/InputGame -name "*.ipa" -exec mv {} output/ \;
          cd output
          zip -s 1500m -r game_ipa.zip *.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa
          path: output/game_ipa*
          retention-days: 1
