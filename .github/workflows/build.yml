name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      base_game_drive_id:
        description: 'Google Drive File ID for Base Game (.nsp)'
        required: true
        type: string
      update_drive_id:
        description: 'Google Drive File ID for Update (.nsp)'
        required: true
        type: string

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4
        with:
          repository: 'seedds/nxnative'
          ref: 'main'

      - name: Select latest Xcode 16+
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Patch repository sources & build scripts
        run: |
          # 1. Target M1/A16 instead of unknown apple-a18
          grep -rl "apple-a18" . | xargs sed -i '' 's/apple-a18/apple-m1/g' || true

          # 2. Fix unresolvable UI style in Launcher.swift
          sed -i '' 's/\.glassProminent/\.borderedProminent/g' dm/ios/Sources/Launcher.swift || true
          sed -i '' 's/glassProminent/borderedProminent/g' dm/ios/Sources/Launcher.swift || true

          # 3. Strip incompatible Metal compiler flags
          grep -rl -- "-fmetal-math-mode=relaxed" . | xargs sed -i '' 's/-fmetal-math-mode=relaxed//g' || true

          # 4. Standardize project objectVersion
          grep -rl "objectVersion = 7" . | xargs sed -i '' 's/objectVersion = 7[0-9]/objectVersion = 56/g' || true

          # 5. Patch build_ipa.sh (or build scripts) to sanitize Gen/ sources right before xcodebuild
          # This ensures that generated files are patched even after the generator creates them
          find scripts dm -name "*.sh" -o -name "*.py" | xargs sed -i '' 's/xcodebuild/sed -i "" "s\/MTL4ComputeCommandEncoder\/MTLComputeCommandEncoder\/g" dm\/ios\/Gen\/src\/*.m 2>\/dev\/null; sed -i "" "s\/MTL4ArgumentTable\/MTLBuffer\/g" dm\/ios\/Gen\/src\/*.m 2>\/dev\/null; sed -i "" "\/setArgumentTable:\/d" dm\/ios\/Gen\/src\/*.m 2>\/dev\/null; xcodebuild/g' || true

          # 6. Patch the static templates and C headers in case they are directly bundled
          grep -rl "MTL4ComputeCommandEncoder" dm/ | xargs sed -i '' 's/MTL4ComputeCommandEncoder/MTLComputeCommandEncoder/g' || true
          grep -rl "MTL4ArgumentTable" dm/ | xargs sed -i '' 's/MTL4ArgumentTable/MTLBuffer/g' || true

      - name: Set up dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

          python3 -m venv ~/build_env
          source ~/build_env/bin/activate

          pip install --upgrade pip
          pip install gdown lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Restore prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS_CONTENT" > ~/.switch/prod.keys

      - name: Download Base Game and Update from Google Drive
        run: |
          source ~/build_env/bin/activate
          mkdir -p ~/Games/InputGame

          echo "Downloading Base Game..."
          for i in {1..10}; do
            gdown "${{ github.event.inputs.base_game_drive_id }}" -O ~/Games/InputGame/base.nsp --continue && break || sleep 5
          done

          echo "Downloading Update..."
          for i in {1..10}; do
            gdown "${{ github.event.inputs.update_drive_id }}" -O ~/Games/InputGame/update.nsp --continue && break || sleep 5
          done

      - name: Build IPA
        run: |
          source ~/build_env/bin/activate

          # Background file-watcher: runs alongside build_ipa to instantly sanitize any newly generated Gen/ files
          (
            while true; do
              if [ -d "dm/ios/Gen/src" ]; then
                find dm/ios/Gen/src -type f -name "*.m" -exec sed -i '' \
                  -e 's/MTL4ComputeCommandEncoder/MTLComputeCommandEncoder/g' \
                  -e 's/MTL4ArgumentTable/MTLBuffer/g' \
                  -e 's/\[.*setArgumentTable:.*\];//g' \
                  -e 's/setArgumentTable:.*//g' \
                  {} + 2>/dev/null || true
              fi
              sleep 0.2
            done
          ) &
          WATCHER_PID=$!

          python scripts/build_ipa_from_nsp.py ~/Games/InputGame -k ~/.switch/prod.keys

          kill $WATCHER_PID || true

      - name: Dump Xcode logs on failure
        if: failure()
        run: |
          echo "=== Dumping build_ipa.log ==="
          find ~/Games/InputGame -name "build_ipa.log" -exec tail -n 100 {} + || true
          echo "=== Dumping pkg/build.log ==="
          find ~/Games/InputGame -name "build.log" -exec tail -n 100 {} + || true

      - name: Package & Split Output IPA
        run: |
          mkdir -p output
          find ~/Games/InputGame -name "*.ipa" -exec mv {} output/ \;
          cd output
          zip -s 1500m -r game_ipa.zip *.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ipa
          path: output/game_ipa*
          retention-days: 1
