name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_dir:
        description: 'Subfolder path containing base NSP, update NSP, and prod.keys'
        required: true
        default: 'Games/InputGame'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout nxnative Repository
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          submodules: recursive

      - name: Checkout Custom Files / Rom Payload
        uses: actions/checkout@v4
        with:
          path: payload_repo

      - name: Setup Game Workspace
        run: |
          mkdir -p "$HOME/Games/InputGame"
          # Move user uploaded NSPs and keys into the expected build directory
          cp -R payload_repo/${{ github.event.inputs.game_dir }}/* "$HOME/Games/InputGame/"
          echo "Files in InputGame:"
          ls -la "$HOME/Games/InputGame"

      - name: Install System Dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Setup Python Environment
        run: |
          python3 -m venv ~/build_env
          source ~/build_env/bin/activate
          pip install --upgrade pip
          pip install lz4 capstone fonttools nsz "backports.zstd; python_version < '3.14'"

      # Restores precompiled shaders to prevent 30+ min re-renders on failed runs
      - name: Restore Shader Compilation Cache
        uses: actions/cache@v4
        with:
          path: /Users/runner/Games/InputGame/*_build/shader
          key: ${{ runner.os }}-nxnative-shaders-${{ hashFiles('**/dmsh_chain.lock') }}
          restore-keys: |
            ${{ runner.os }}-nxnative-shaders-

      # Fixes the upstream syntax error in DmGamepad.m (deviceMotionBody typo & readonly assign)
      - name: Patch DmGamepad.m Motion Bug
        run: |
          echo "Patching dm/ios/Sources/DmGamepad.m..."
          if [ -f "dm/ios/Sources/DmGamepad.m" ]; then
            # Fix typo if present
            sed -i '' 's/deviceMotionBody/deviceMotion/g' dm/ios/Sources/DmGamepad.m || true
            # Comment out the invalid assignment line 94
            sed -i '' '94s/^/\/\//' dm/ios/Sources/DmGamepad.m || true
            git diff dm/ios/Sources/DmGamepad.m
          else
            echo "File dm/ios/Sources/DmGamepad.m not found, checking directory structure..."
            find . -name "DmGamepad.m" -exec sed -i '' 's/deviceMotionBody/deviceMotion/g' {} +
            find . -name "DmGamepad.m" -exec sed -i '' '94s/^/\/\//' {} +
          fi

      - name: Execute nxnative Build Pipeline
        run: |
          source ~/build_env/bin/activate
          # Auto-detect prod.keys location inside input directory
          KEY_PATH="$HOME/Games/InputGame/prod.keys"
          if [ ! -f "$KEY_PATH" ]; then
            KEY_PATH=$(find "$HOME/Games/InputGame" -name "*.keys" | head -n 1)
          fi

          python3 scripts/build_ipa_from_nsp.py "$HOME/Games/InputGame" -k "$KEY_PATH"

      # Verifies the compiled Mach-O binary actually linked before generating artifacts
      - name: Validate Mach-O Executable Integrity
        run: |
          IPA_PATH=$(find "$HOME/Games/InputGame" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "FATAL: No IPA was generated!"
            exit 1
          fi
          echo "Inspecting IPA: $IPA_PATH"
          mkdir -p /tmp/ipa_verify
          unzip -q "$IPA_PATH" -d /tmp/ipa_verify
          APP_DIR=$(find /tmp/ipa_verify/Payload -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_DIR" .app)
          file "$APP_DIR/$APP_NAME" || file "$APP_DIR/DmIOS"
          echo "SUCCESS: App binary is present and valid."

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaBreathOfTheWild-nxnative-IPA
          path: /Users/runner/Games/InputGame/*.ipa
          retention-days: 5
